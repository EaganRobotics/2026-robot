name: Simulation Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulate:
    name: 5-Second Robot Simulation
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2025-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Filter changes for relevant files
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            java:
              - 'src/main/java/**'
              - 'build.gradle'

      - name: Grant execute permission for gradlew
        if: steps.filter.outputs.java == 'true'
        run: chmod +x gradlew

      - name: Setup Gradle
        if: steps.filter.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run simulation smoke test
        if: steps.filter.outputs.java == 'true'
        run: ./gradlew test --tests "frc.robot26.RobotSimulationTest" --no-daemon
